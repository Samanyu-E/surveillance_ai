[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survai"
version = "0.1.0"
description = "Local camera monitoring with a live dashboard, guest tracking, and restaurant alerts."
readme = "README.md"
requires-python = ">=3.11,<3.14"

[tool.setuptools.package-data]
survai = ["*.html", "*.js", "*.yaml", "*.png"]

[tool.ruff]
target-version = "py311"
